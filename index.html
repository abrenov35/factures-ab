<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Factures — AB RENOV 35</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#162D49;--beige:#F3EAE2;--lav:#A495C3;--lav-dark:#7B6BA8;
  --lav-light:#EDE9F4;--white:#fff;--grey:#8A8078;--border:#C8BFB5;
  --bgsoft:#EAE4DC;--green:#2D7D52;--green-light:#EAF4EF;--red:#C0392B;
  --cream:#F3EAE2;
}
html,body{min-height:100%;background:var(--cream);font-family:'Barlow',sans-serif;color:var(--navy);}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;}
input,select,textarea{font-family:inherit;}

/* HEADER */
#header{background:var(--navy);position:sticky;top:0;z-index:100;}
#header-inner{max-width:560px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.logo-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:#fff;letter-spacing:1.5px;text-transform:uppercase;}
.logo-sub{font-size:9px;color:var(--lav);letter-spacing:2.5px;font-weight:700;text-transform:uppercase;margin-top:2px;}
#header-bar{height:3px;background:linear-gradient(90deg,var(--lav),var(--lav-dark),var(--navy));}

/* TABS */
#tabs-bar{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:54px;z-index:99;}
#tabs-inner{max-width:560px;margin:0 auto;display:flex;}
.tab-btn{flex:1;padding:10px 8px;border:none;background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--lav);}

/* MAIN */
#app{max-width:560px;margin:0 auto;padding:10px 12px 30px;}

/* CARDS */
.card-navy{background:var(--navy);border-radius:12px;padding:14px 14px;margin-bottom:10px;box-shadow:0 6px 20px rgba(22,45,73,.2);}
.card-white{background:var(--white);border-radius:14px;padding:18px 16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(22,45,73,.07);border:1.5px solid var(--border);}

/* LABELS */
.lbl-white{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin-bottom:6px;}
.lbl-navy{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);margin-bottom:6px;}
.lbl-grey{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin-bottom:5px;}

/* DROP ZONE */
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bgsoft);}
.drop-zone:hover,.drop-zone.drag{border-color:var(--lav);background:var(--lav-light);}
.drop-icon{font-size:32px;margin-bottom:8px;}
.drop-title{font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-bottom:4px;}
.drop-sub{font-size:11px;color:var(--grey);}
.drop-btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;}

/* PREVIEW */
.preview-wrap{border-radius:10px;overflow:hidden;background:#000;max-height:220px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.preview-wrap img{max-width:100%;max-height:220px;object-fit:contain;}

/* INPUTS */
.form-input{width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;color:var(--navy);font-weight:500;background:var(--white);outline:none;}
.form-input:focus{border-color:var(--navy);}
.form-input-lav{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #C4B8E0;font-size:14px;color:var(--navy);font-weight:500;background:var(--lav-light);outline:none;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-group{margin-bottom:8px;}

/* IA BOX */
.ia-loading{display:flex;align-items:center;gap:10px;font-size:13px;color:#fff;font-weight:600;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.ia-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(164,149,195,.2);border:1px solid var(--lav);border-radius:20px;padding:4px 12px;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lav);margin-bottom:12px;}

/* BOUTONS */
.btn{height:40px;padding:0 14px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:disabled{opacity:.35;cursor:not-allowed;}
.btn-lav{background:var(--lav);color:#fff;box-shadow:0 4px 14px rgba(164,149,195,.4);}
.btn-green{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(45,125,82,.3);}
.btn-ghost{background:var(--navy);border:1.5px solid var(--navy);color:#fff;}
.btn-ghost-dark{background:transparent;border:1.5px solid var(--border);color:var(--navy);}
.btn-full{width:100%;}
.btn-red{background:#FDECEA;border:1.5px solid #F5C6C2;color:var(--red);}

/* FILENAME */
.filename-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:10px 14px;font-size:11px;font-weight:600;color:rgba(255,255,255,.85);word-break:break-all;}

/* LISTE FACTURES */
.facture-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bgsoft);}
.facture-row:last-child{border-bottom:none;}
.facture-icon{font-size:28px;flex-shrink:0;width:36px;text-align:center;}
.facture-info{flex:1;min-width:0;}
.facture-nom{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--navy);}
.facture-meta{font-size:11px;color:var(--grey);margin-top:3px;}
.facture-file{font-size:9px;color:var(--border);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.facture-montant{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--navy);flex-shrink:0;text-align:right;}
.badge-ok{display:inline-block;background:var(--green-light);color:var(--green);border-radius:20px;padding:2px 8px;font-size:9px;font-weight:700;margin-top:3px;}

/* PROGRESS */
.progress-track{background:rgba(255,255,255,.15);border-radius:99px;height:6px;overflow:hidden;margin:10px 0 6px;}
.progress-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lav),#fff);transition:width .4s ease;width:0%;}

/* ÉTATS */
.success-banner{background:var(--green-light);border:1.5px solid #A8D5BC;border-radius:12px;padding:18px;text-align:center;}
.success-title{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-bottom:6px;}
.success-file{font-size:11px;color:var(--green);opacity:.8;word-break:break-all;}
.err{background:#FDECEA;border:1.5px solid #F5C6C2;border-radius:10px;padding:12px 14px;font-size:12px;font-weight:600;color:var(--red);margin-bottom:10px;}
.empty{padding:40px 16px;text-align:center;}
.empty-icon{font-size:2.5rem;opacity:.25;margin-bottom:10px;}
.empty-text{font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);}
.note-box{background:rgba(164,149,195,.12);border:1px solid rgba(164,149,195,.3);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--grey);text-align:center;margin-top:4px;}

.section-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.section-icon{background:var(--lav);border-radius:6px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;}
.section-label{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;}
.section-label-dark{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);}
</style>
</head>
<body>

<div id="header">
  <div id="header-inner">
    <div>
      <div class="logo-title">AB RENOV 35</div>
      <div class="logo-sub">Factures &amp; Notes de frais</div>
    </div>
    <div style="font-size:1.4rem;">🧾</div>
  </div>
  <div id="header-bar"></div>
</div>

<div id="tabs-bar">
  <div id="tabs-inner">
    <button class="tab-btn active" onclick="switchTab('import')">📤 Importer</button>
    <button class="tab-btn" onclick="switchTab('liste')">📋 Historique</button>
  </div>
</div>

<div id="app"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbz4qXrt7QZbV0Yb5spXaBtb2nhdRPE7nXYRAyxs78E5NkJpzDDkgog7yxv6TBzqX1yp/exec";
const DROPBOX_FOLDER = "/AB RENOV 35/1. FACTURES A CLASSER";

let tab = "import";
let fileData = null;
let extraction = null;
let factures = [];
let state = "idle";
let errMsg = "";

function eur(n){return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2}).format(Number(n));}
function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFileName(ext) {
  if(!extraction) return "";
  const clean = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9&]/g,"").trim();
  const f = clean(extraction.fournisseur);
  const dateParts = (extraction.date||"").split("-");
  const d = dateParts.length>=2 ? dateParts[0]+dateParts[1] : "";
  const l = clean(extraction.libelle).replace(/^-+|-+$/g,"").slice(0,40);
  const m = (extraction.montant||"0").replace(/[^\d,.]/g,"").replace(",",".");
  return `${f}${d}${l}-${m}.${ext}`;
}

function switchTab(t) {
  tab = t;
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active", (t==="import"&&i===0)||(t==="liste"&&i===1)));
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(tab==="import") renderImport(app);
  else renderListe(app);
}

function renderImport(app) {

  // ERREUR
  if(errMsg){
    const b=mk("div","err");
    b.innerHTML=`⚠ ${esc(errMsg)}`;
    app.append(b);
  }

  // SUCCÈS
  if(state==="sent") {
    const s=mk("div","success-banner");
    s.innerHTML=`
      <div style="font-size:2rem;margin-bottom:8px;">✅</div>
      <div class="success-title">Facture envoyée !</div>
      <div class="success-file">${esc(buildFileName(fileData?.ext||"pdf"))}</div>`;
    app.append(s);
    const btn=mk("button","btn btn-navy btn-full");
    btn.style.marginTop="12px";
    btn.innerHTML="＋ &nbsp;Nouvelle facture";
    btn.onclick=()=>{fileData=null;extraction=null;state="idle";errMsg="";render();};
    app.append(btn);
    return;
  }

  // ZONE IMPORT — pas de fichier
  if(!fileData) {
    const card=mk("div","card-navy");
    card.innerHTML=`
      <div class="section-title">
        <div class="section-icon">📤</div>
        <div class="section-label">Importer une facture</div>
      </div>
      <div class="drop-zone" id="drop-zone">
        <div class="drop-icon">🧾</div>
        <div class="drop-title">Photo ou PDF</div>
        <div class="drop-sub">Facture, ticket, note de frais</div>
        <div class="drop-btns">
          <label class="btn btn-lav" style="cursor:pointer;">
            📷 Prendre une photo
            <input type="file" accept="image/*" capture="environment" style="display:none" onchange="onFile(this)">
          </label>
          <label class="btn btn-ghost" style="cursor:pointer;">
            📁 Choisir un fichier
            <input type="file" accept=".pdf,.png,.jpg,.jpeg,image/*" style="display:none" onchange="onFile(this)">
          </label>
        </div>
      </div>`;
    // Drag & drop
    const dz=card.querySelector("#drop-zone");
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag");if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);});
    app.append(card);
    return;
  }

  // FICHIER CHARGÉ — preview + analyse
  const previewCard=mk("div","card-navy");

  // Header
  previewCard.innerHTML=`
    <div class="section-title">
      <div class="section-icon">🔍</div>
      <div class="section-label">${esc(fileData.name)}</div>
    </div>`;

  // Preview image
  if(fileData.mimeType!=="application/pdf") {
    const pw=mk("div","preview-wrap");
    const img=mk("img");img.src=fileData.dataUrl;
    pw.append(img);
    previewCard.append(pw);
  } else {
    const pdflbl=mk("div","");
    pdflbl.style.cssText="background:rgba(255,255,255,.1);border-radius:8px;padding:12px;text-align:center;font-size:13px;color:rgba(255,255,255,.8);margin-bottom:12px;";
    pdflbl.innerHTML="📄 <strong>Fichier PDF</strong> prêt à analyser";
    previewCard.append(pdflbl);
  }

  if(state==="loading") {
    const ia=mk("div","");ia.style.cssText="margin:8px 0;";
    ia.innerHTML=`<div class="ia-loading"><div class="spinner"></div> Analyse en cours par l'IA…</div>`;
    previewCard.append(ia);
    const prog=mk("div","");
    prog.innerHTML=`<div class="progress-track"><div class="progress-bar" style="width:60%;animation:none;"></div></div>`;
    previewCard.append(prog);
  } else {
    const analyseBtn=mk("button","btn btn-lav btn-full");
    analyseBtn.style.marginBottom="8px";
    analyseBtn.innerHTML=extraction?"↻ &nbsp;Ré-analyser":"⚡ &nbsp;Analyser avec l'IA";
    analyseBtn.onclick=analyser;
    const changeBtn=mk("button","btn btn-ghost btn-full");
    changeBtn.innerHTML="🔄 &nbsp;Changer de fichier";
    changeBtn.onclick=()=>{fileData=null;extraction=null;state="idle";render();};
    previewCard.append(analyseBtn, changeBtn);
  }

  app.append(previewCard);

  // RÉSULTAT EXTRACTION + FORMULAIRE
  if(extraction && state!=="loading") {
    const fcard=mk("div","card-navy");

    // Badge IA
    const badge=mk("div","ia-badge");badge.innerHTML="⚡ Extrait par l'IA — vérifiez et corrigez";
    fcard.append(badge);

    // Fournisseur
    const g1=mk("div","form-group");
    g1.innerHTML=`<div class="lbl-white">Fournisseur</div>
      <input class="form-input-lav" id="f-fournisseur" value="${esc(extraction.fournisseur)}" placeholder="Nom du fournisseur">`;
    fcard.append(g1);

    // Date + Montant
    const row=mk("div","form-row");
    row.innerHTML=`
      <div>
        <div class="lbl-white">Date</div>
        <input class="form-input-lav" id="f-date" value="${esc(extraction.date)}" placeholder="JJ-MM-AAAA">
      </div>
      <div>
        <div class="lbl-white">Montant TTC (€)</div>
        <input class="form-input-lav" id="f-montant" type="number" step="0.01" value="${esc(extraction.montant)}" placeholder="0.00">
      </div>`;
    fcard.append(row);

    // Libellé
    const g2=mk("div","form-group");g2.style.marginTop="10px";
    g2.innerHTML=`<div class="lbl-white">Libellé</div>
      <input class="form-input-lav" id="f-libelle" value="${esc(extraction.libelle)}" placeholder="Description courte">`;
    fcard.append(g2);

    // Nom fichier
    const fnbox=mk("div","");fnbox.style.marginBottom="14px";
    fnbox.innerHTML=`<div class="lbl-white" style="margin-bottom:5px;">Nom du fichier Dropbox</div>
      <div class="filename-box" id="filename-preview">${esc(buildFileName(fileData.mimeType==="application/pdf"?"pdf":fileData.mimeType.split("/")[1]||"jpg"))}</div>`;
    fcard.append(fnbox);

    // UPLOAD PROGRESS
    if(state==="sending") {
      const ov=mk("div","");
      ov.style.cssText="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:16px;text-align:center;";
      ov.innerHTML=`
        <div style="font-size:2rem;margin-bottom:8px;animation:pulse 1.2s ease-in-out infinite;">📤</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-bottom:4px;">Envoi en cours…</div>
        <div id="upload-step" style="font-size:11px;color:rgba(255,255,255,.6);margin-bottom:10px;">Préparation…</div>
        <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        <div id="progress-pct" style="font-size:11px;font-weight:800;color:#fff;margin-top:4px;">0 %</div>`;
      fcard.append(ov);
    } else {
      // Boutons action
      const btns=mk("div","");btns.style.cssText="display:flex;gap:8px;";
      const sendBtn=mk("button","btn btn-green");sendBtn.style.flex="1";
      sendBtn.innerHTML="💾 &nbsp;Envoyer vers Dropbox";
      sendBtn.onclick=validerEtEnvoyer;
      const cancelBtn=mk("button","btn btn-ghost");
      cancelBtn.innerHTML="✕";cancelBtn.title="Annuler";
      cancelBtn.onclick=()=>{fileData=null;extraction=null;state="idle";render();};
      btns.append(sendBtn,cancelBtn);
      fcard.append(btns);
    }
    app.append(fcard);
  }
}

function renderListe(app) {
  const count=factures.length;

  const card=mk("div","card-white");

  // Header
  const hdr=mk("div","");hdr.style.cssText="display:flex;align-items:center;gap:10px;margin-bottom:14px;";
  hdr.innerHTML=`
    <div style="background:var(--lav-light);border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.9rem;">📋</div>
    <div>
      <div class="section-label-dark">Historique</div>
      <div style="font-size:.72rem;color:var(--grey);margin-top:1px;">${count} facture${count>1?"s":""} envoyée${count>1?"s":""}</div>
    </div>`;
  card.append(hdr);

  if(!count) {
    const em=mk("div","empty");
    em.innerHTML=`<div class="empty-icon">📭</div><div class="empty-text">Aucune facture envoyée</div>`;
    card.append(em);
  } else {
    [...factures].reverse().forEach(f=>{
      const row=mk("div","facture-row");
      row.innerHTML=`
        <div class="facture-icon">${f.type==="pdf"?"📄":"🖼️"}</div>
        <div class="facture-info">
          <div class="facture-nom">${esc(f.fournisseur)}</div>
          <div class="facture-meta">${esc(f.date)} · ${esc(f.libelle)}</div>
          <div class="facture-file">${esc(f.filename)}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div class="facture-montant">${eur(f.montant)}</div>
          <div><span class="badge-ok">✓ Dropbox</span></div>
        </div>`;
      card.append(row);
    });
  }
  app.append(card);

  const note=mk("div","note-box");
  note.innerHTML="☁️ Dropbox → <strong>AB RENOV 35 / 1. FACTURES A CLASSER</strong>";
  app.append(note);
}

// ── FICHIER ───────────────────────────────────────────────────────────────
function onFile(input){if(input.files[0])handleFile(input.files[0]);}
function handleFile(file) {
  const reader=new FileReader();
  reader.onload=e=>{
    fileData={dataUrl:e.target.result,base64:e.target.result.split(",")[1],mimeType:file.type||"image/jpeg",name:file.name,raw:file};
    extraction=null;state="idle";errMsg="";render();
  };
  reader.readAsDataURL(file);
}

// ── ANALYSE IA ────────────────────────────────────────────────────────────
async function extractPdfText(base64) {
  const binary=atob(base64);const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  let text="";
  for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const content=await page.getTextContent();text+=content.items.map(i=>i.str).join(" ")+"\n";}
  return text.trim();
}

async function analyser() {
  state="loading";errMsg="";render();
  try {
    let body;
    if(fileData.mimeType==="application/pdf"){const text=await extractPdfText(fileData.base64);body=JSON.stringify({text,mimeType:"text/plain"});}
    else{body=JSON.stringify({base64:fileData.base64,mimeType:fileData.mimeType});}
    const resp=await fetch(GAS_URL+"?method=ANALYSE",{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain"},body});
    const data=await resp.json();
    if(data.error)throw new Error(data.error);
    extraction=data;state="extracted";
  } catch(e){errMsg="Erreur d'analyse : "+e.message;state="idle";}
  render();
}

// ── ENVOI DROPBOX ─────────────────────────────────────────────────────────
async function validerEtEnvoyer() {
  extraction.fournisseur=document.getElementById("f-fournisseur")?.value.trim()||extraction.fournisseur;
  extraction.date=document.getElementById("f-date")?.value.trim()||extraction.date;
  extraction.montant=document.getElementById("f-montant")?.value.trim()||extraction.montant;
  const libelleEl=document.getElementById("f-libelle");
  if(libelleEl)extraction.libelle=libelleEl.value.trim();
  if(!extraction.fournisseur||!extraction.montant){errMsg="Fournisseur et montant obligatoires";render();return;}

  state="sending";errMsg="";render();
  const ext=fileData.mimeType==="application/pdf"?"pdf":fileData.mimeType.split("/")[1]||"jpg";
  fileData.ext=ext;
  const filename=buildFileName(ext);

  function setProgress(pct,step){
    const bar=document.getElementById("progress-bar");
    const pctEl=document.getElementById("progress-pct");
    const stepEl=document.getElementById("upload-step");
    if(bar)bar.style.width=pct+"%";
    if(pctEl)pctEl.textContent=pct+" %";
    if(stepEl)stepEl.textContent=step;
  }

  try {
    setProgress(15,"Connexion à Dropbox…");await new Promise(r=>setTimeout(r,300));
    setProgress(35,"Envoi du fichier…");
    const upResp=await fetch(GAS_URL+"?method=UPLOAD",{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain"},body:JSON.stringify({base64:fileData.base64,filename})});
    setProgress(75,"Enregistrement…");
    const upData=await upResp.json();
    if(upData.error)throw new Error(upData.error);
    setProgress(90,"Sauvegarde dans le tableau…");
    const entry={id:Date.now().toString(),fournisseur:extraction.fournisseur,date:extraction.date,libelle:extraction.libelle,montant:extraction.montant,filename,type:ext,dropboxPath:upData.path||DROPBOX_FOLDER+"/"+filename,ts:new Date().toISOString()};
    await fetch(GAS_URL+"?method=SAVE",{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain"},body:JSON.stringify(entry)});
    setProgress(100,"✅ Reçu dans Dropbox !");
    await new Promise(r=>setTimeout(r,500));
    factures.push(entry);state="sent";
  } catch(e){errMsg="Erreur envoi : "+e.message;state="extracted";}
  render();
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init() {
  try{const r=await fetch(GAS_URL+"?method=GET",{redirect:"follow"});const data=await r.json();if(Array.isArray(data))factures=data;}catch(e){}
  render();
}
init();
</script>
